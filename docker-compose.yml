# Local Postgres + pgvector for development: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoclaims
    ports:
      - "5432:5432"
    volumes:
      - autoclaims-data:/var/lib/postgresql/data
volumes:
  autoclaims-data:
